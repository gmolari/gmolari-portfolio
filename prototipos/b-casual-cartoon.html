<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>B · Casual Cartoon — Molari</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--sky:#7cc8f2;--sky2:#a9dcf7;--ink:#1e2a4a;--card:#fff;--yellow:#ffcf3f;--coral:#ff6b5b;--mint:#43d6a5;--blue:#3a7bea;
  --d:"Lilita One",system-ui,sans-serif;--b:"Nunito",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;font-family:var(--b);color:var(--ink);background:linear-gradient(var(--sky),var(--sky2) 70%);min-height:100vh;overflow-x:hidden}
.cloud{position:absolute;background:#fff;border-radius:60px;opacity:.9;animation:float linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:55%;height:150%;left:15%;top:-60%}.cloud::after{width:40%;height:120%;right:12%;top:-40%}
@keyframes float{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.wrap{position:relative;max-width:1080px;margin:0 auto;padding:28px 16px 80px}
nav{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.lvl{display:flex;align-items:center;gap:10px;background:var(--card);border:4px solid var(--ink);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:0 5px 0 var(--ink);font-weight:800}
.lvl .badge{width:38px;height:38px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--d);font-size:18px}
.bar{width:120px;height:14px;border-radius:99px;background:#e3ecf7;border:3px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;width:35%;background:var(--mint);border-radius:99px;transition:width .5s cubic-bezier(.3,1.6,.5,1)}
.coins{font-family:var(--d);font-size:20px;background:var(--card);border:4px solid var(--ink);border-radius:999px;padding:6px 16px 6px 10px;box-shadow:0 5px 0 var(--ink);display:flex;gap:8px;align-items:center}
.coin{width:24px;height:24px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);display:inline-block}
.hero{text-align:center;padding:56px 0 30px}
h1{font-family:var(--d);font-weight:400;font-size:clamp(46px,10vw,110px);line-height:.95;margin:0;color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 8px 0 var(--ink)}
h1 span{display:inline-block;animation:squash .8s cubic-bezier(.3,1.5,.5,1) both}
@keyframes squash{0%{transform:translateY(-120px) scale(1,1.3);opacity:0}55%{transform:translateY(0) scale(1.3,.7)}75%{transform:scale(.9,1.1)}100%{transform:none}}
.role{display:inline-block;margin-top:22px;background:var(--coral);color:#fff;font-family:var(--d);font-size:clamp(18px,3vw,26px);padding:8px 22px;border:4px solid var(--ink);border-radius:16px;box-shadow:0 6px 0 var(--ink);transform:rotate(-2deg);animation:pop .6s .9s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{from{transform:scale(0) rotate(-12deg)}}
.hero p{max-width:56ch;margin:24px auto 0;font-size:18px;font-weight:700}
.play{margin-top:30px;font-family:var(--d);font-size:28px;color:var(--ink);background:var(--yellow);border:5px solid var(--ink);border-radius:22px;padding:14px 46px;box-shadow:0 9px 0 var(--ink);cursor:pointer;transition:transform .1s;animation:breathe 1.6s 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.06)}}
.play:hover{animation:jelly .5s}
@keyframes jelly{30%{transform:scale(1.2,.8)}50%{transform:scale(.88,1.12)}70%{transform:scale(1.05,.95)}}
.play:active{transform:translateY(8px);box-shadow:0 1px 0 var(--ink)}
h2{font-family:var(--d);font-weight:400;font-size:40px;margin:60px 0 20px;color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:22px}
.card{background:var(--card);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:0 0 18px;overflow:hidden;cursor:pointer;
  transition:transform .25s cubic-bezier(.3,1.8,.5,1),box-shadow .25s;animation:in .6s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(1.2s + var(--i)*90ms)}
@keyframes in{from{transform:translateY(60px) scale(.8);opacity:0}}
.card:nth-child(odd):hover{transform:translateY(-10px) rotate(-2deg)}
.card:nth-child(even):hover{transform:translateY(-10px) rotate(2deg)}
.card:hover{box-shadow:0 18px 0 var(--ink)}
.thumb{height:120px;border-bottom:4px solid var(--ink);display:grid;place-items:center;position:relative}
.thumb .ico{width:64px;height:64px;border:4px solid var(--ink);border-radius:18px;background:#fff;transform:rotate(-6deg);transition:transform .4s cubic-bezier(.3,2,.5,1)}
.card:hover .ico{transform:rotate(8deg) scale(1.15)}
.stars{position:absolute;top:10px;right:12px;display:flex;gap:3px}
.stars i{width:16px;height:16px;background:var(--yellow);border:2px solid var(--ink);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.card h3{font-family:var(--d);font-weight:400;font-size:24px;margin:14px 18px 4px}
.card p{margin:0 18px;font-weight:600;font-size:15px;line-height:1.4;color:#43507a}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 18px 0}
.tags span{font-size:12px;font-weight:800;border:2px solid var(--ink);border-radius:99px;padding:2px 9px;background:#eef4ff}
.burst{position:fixed;width:22px;height:22px;border-radius:50%;background:var(--yellow);border:3px solid var(--ink);pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*,.cloud{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="cloud" style="width:180px;height:52px;top:90px;animation-duration:48s"></div>
<div class="cloud" style="width:120px;height:36px;top:260px;animation-duration:36s;animation-delay:-20s"></div>
<div class="cloud" style="width:220px;height:60px;top:520px;animation-duration:60s;animation-delay:-40s"></div>
<div class="wrap">
  <nav>
    <div class="lvl"><span class="badge" id="lv">7</span><div><div style="font-size:12px">DEV LEVEL</div><div class="bar"><i id="bar"></i></div></div></div>
    <div class="coins"><span class="coin"></span><span id="coins">0</span></div>
  </nav>
  <section class="hero">
    <h1 id="h1"></h1>
    <div class="role">Senior Software Engineer</div>
    <p>Construo interfaces e loops de gamificação que fazem as pessoas voltarem: minigames, missões, recompensas e tempo real. Do Figma ao deploy.</p>
    <button class="play" id="play" type="button">JOGAR</button>
  </section>
  <h2>Fases desbloqueadas</h2>
  <div class="cards" id="cards"></div>
</div>
<script>
const name="Guilherme Molari";
document.getElementById('h1').innerHTML=name.split(' ').map((w,wi)=>[...w].map((c,i)=>`<span style="animation-delay:${(wi*8+i)*55}ms">${c}</span>`).join('')).join('<br>');
const P=[["Gamification Loop","Missões, níveis, recompensas e minigames em PixiJS. Feito praticamente solo.",["Next.js","PixiJS","Zustand"],"#ffcf3f",3],
["Supernova Bet","Front pioneiro da plataforma de iGaming, com tempo real.",["React","socket.io","React Query"],"#ff6b5b",3],
["Mosaico Neon","Block puzzle para web, Android e iOS sobre meu motor de jogos.",["PixiJS v8","Capacitor"],"#43d6a5",3],
["VortexVolley","App + API em tempo real, full stack.",["Expo","NestJS"],"#3a7bea",2],
["Minigames Showcase","Roleta, caixas e raspadinha com animação de verdade.",["Framer Motion","Canvas"],"#ff9fd0",2],
["CityBuilder","Mod de city-builder/RTS para Minecraft.",["Kotlin","Fabric"],"#9ad14b",2]];
document.getElementById('cards').innerHTML=P.map((p,i)=>`<article class="card" style="--i:${i}"><div class="thumb" style="background:${p[3]}"><div class="stars">${'<i></i>'.repeat(p[4])}</div><div class="ico"></div></div><h3>${p[0]}</h3><p>${p[1]}</p><div class="tags">${p[2].map(t=>`<span>${t}</span>`).join('')}</div></article>`).join('');
let coins=0,xp=35;
function burst(x,y,n=8){const cEl=document.getElementById('coins').getBoundingClientRect();
  for(let i=0;i<n;i++){const b=document.createElement('div');b.className='burst';b.style.left=x+'px';b.style.top=y+'px';document.body.append(b);
    const a=Math.random()*Math.PI*2,r=60+Math.random()*60;
    b.animate([{transform:'translate(0,0) scale(.4)'},{transform:`translate(${Math.cos(a)*r}px,${Math.sin(a)*r}px) scale(1)`,offset:.4},{transform:`translate(${cEl.left-x}px,${cEl.top-y}px) scale(.6)`}],{duration:900+i*40,easing:'cubic-bezier(.5,0,.5,1)'}).onfinish=()=>{b.remove();coins++;document.getElementById('coins').textContent=coins}}
  xp=Math.min(100,xp+6);document.getElementById('bar').style.width=xp+'%'}
document.getElementById('play').addEventListener('click',e=>burst(e.clientX,e.clientY,12));
document.querySelectorAll('.card').forEach(c=>c.addEventListener('click',e=>burst(e.clientX,e.clientY,6)));
</script>
</body>
</html>
