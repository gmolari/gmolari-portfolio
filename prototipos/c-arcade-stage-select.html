<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C · Arcade Stage Select — Molari</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
:root{--bg:#0a0f24;--panel:#121a3a;--ink:#e9ecf8;--y:#ffd23f;--r:#ff4b4b;--b:#2fa8ff;--g:#4be08a;--mut:#7f8bb8;
  --px:"Press Start 2P",monospace;--vt:"VT323",monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--vt);font-size:22px;min-height:100vh;overflow-x:hidden}
.crt::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:30;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 2px,transparent 2px 4px)}
.crt::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:31;background:radial-gradient(ellipse at center,transparent 60%,rgba(0,0,0,.65));animation:flick 4s infinite}
@keyframes flick{0%,96%,100%{opacity:1}97%{opacity:.85}}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
.top{display:flex;justify-content:space-between;font-family:var(--px);font-size:12px;gap:12px;flex-wrap:wrap}
.top b{color:var(--r)} .top span{color:var(--y)}
h1{font-family:var(--px);text-align:center;font-size:clamp(20px,4vw,40px);margin:34px 0 6px;color:var(--y);text-shadow:4px 4px 0 var(--r),8px 8px 0 #000;animation:zoom .7s steps(7) both}
@keyframes zoom{from{transform:scale(3);opacity:0}}
.sub{text-align:center;color:var(--mut);margin:0 0 26px;letter-spacing:.05em}
.layout{display:grid;grid-template-columns:1.25fr 1fr;gap:24px}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.st{aspect-ratio:1;background:var(--panel);border:4px solid #2a356b;position:relative;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:10px;overflow:hidden;
  animation:slot .4s steps(4) both;animation-delay:calc(.7s + var(--i)*80ms)}
@keyframes slot{from{transform:translateY(-30px);opacity:0}}
.st .art{position:absolute;inset:0;opacity:.85;transition:transform .3s steps(4)}
.st:hover .art,.st.sel .art{transform:scale(1.12)}
.st .n{position:relative;font-family:var(--px);font-size:9px;line-height:1.5;text-shadow:2px 2px 0 #000}
.st .num{position:absolute;top:8px;left:8px;font-family:var(--px);font-size:9px;color:var(--y);text-shadow:2px 2px 0 #000}
.st.sel{border-color:var(--y);animation:none;box-shadow:0 0 0 4px var(--bg),0 0 0 8px var(--y)}
.st.sel::after{content:"1P";position:absolute;top:-2px;right:-2px;background:var(--r);font-family:var(--px);font-size:9px;padding:4px 6px;animation:blink .5s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.info{background:var(--panel);border:4px solid #2a356b;padding:18px;min-width:0}
.info h2{font-family:var(--px);font-size:15px;color:var(--y);margin:0 0 8px;line-height:1.5}
.info .role{color:var(--g);margin:0 0 12px}
.info p{margin:0 0 16px;line-height:1.15}
.stat{display:grid;grid-template-columns:110px 1fr;gap:10px;align-items:center;margin:6px 0;font-family:var(--px);font-size:9px}
.stat .b{height:12px;background:#0a0f24;border:2px solid var(--mut)}
.stat .b i{display:block;height:100%;background:var(--b);transition:width .4s steps(8)}
.tech{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tech span{border:2px solid var(--b);color:var(--b);padding:0 8px}
.press{margin-top:18px;font-family:var(--px);font-size:11px;color:var(--y);animation:blink 1s steps(1) infinite}
.help{text-align:center;color:var(--mut);margin-top:22px;font-family:var(--px);font-size:9px;line-height:2}
.ready{position:fixed;inset:0;background:#000;z-index:20;display:grid;place-items:center;text-align:center;animation:bars .9s steps(9) both}
@keyframes bars{from{clip-path:polygon(0 48%,100% 48%,100% 52%,0 52%)}to{clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}}
.ready h3{font-family:var(--px);font-size:clamp(16px,3vw,28px);color:var(--y);margin:0 0 16px}
.ready p{font-family:var(--px);font-size:11px;color:var(--mut)}
.coin{position:fixed;inset:0;background:var(--bg);z-index:25;display:grid;place-items:center;font-family:var(--px);font-size:16px;color:var(--y);cursor:pointer}
.coin div{animation:blink 1s steps(1) infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="crt">
<div class="coin" id="coin"><div>INSERT COIN</div></div>
<div class="wrap">
  <div class="top"><div><b>1UP</b> <span id="score">000000</span></div><div>HI-SCORE <span>GUILHERME MOLARI</span></div><div>CREDIT <span id="cr">0</span></div></div>
  <h1>SELECT STAGE</h1>
  <p class="sub">SENIOR SOFTWARE ENGINEER · FULL STACK · GAMIFICAÇÃO</p>
  <div class="layout">
    <div class="grid" id="grid"></div>
    <aside class="info" id="info" aria-live="polite"></aside>
  </div>
  <div class="help">SETAS ESCOLHEM · ENTER JOGA · ESC VOLTA · MOUSE TAMBÉM FUNCIONA</div>
</div>
<div class="ready" id="ready" hidden></div>
<script>
const S=[
 {n:"GAMIFICATION LOOP",r:"Supernova / Play4Tune · praticamente solo",d:"Loop de retenção com missões, níveis, baús e minigames em PixiJS, integrado à plataforma de apostas.",s:[95,90,70],t:["Next.js","PixiJS","Zustand","React Query"],c:["#ffd23f","#ff4b4b"]},
 {n:"SUPERNOVA BET",r:"Front pioneiro",d:"Plataforma de iGaming: cassino, esportes, tempo real e integrações de pagamento.",s:[85,70,80],t:["React","socket.io","Zustand"],c:["#ff4b4b","#2fa8ff"]},
 {n:"MOSAICO NEON",r:"Lab de jogos · solo",d:"Block puzzle 8×8 para web, Android e iOS, rodando no meu motor de decisão.",s:[90,85,60],t:["PixiJS v8","Capacitor","TS"],c:["#2fa8ff","#4be08a"]},
 {n:"MOTOR DE JOGOS",r:"Lab de jogos · solo",d:"Dealer, policy de anúncios, maturidade, bem-estar e a casca completa dos apps.",s:[80,95,65],t:["TypeScript","AdMob"],c:["#4be08a","#ffd23f"]},
 {n:"VORTEXVOLLEY",r:"Projeto pessoal · solo",d:"App mobile + API em tempo real, do banco ao app.",s:[75,80,90],t:["Expo","NestJS","socket.io"],c:["#c88bff","#2fa8ff"]},
 {n:"CITYBUILDER",r:"Projeto pessoal · solo",d:"Mod city-builder/RTS para Minecraft 1.20.",s:[60,85,95],t:["Kotlin","Fabric"],c:["#9ad14b","#ff8f3f"]}];
const g=document.getElementById('grid'),info=document.getElementById('info');let sel=0,score=0,seen=new Set(),started=false;
g.innerHTML=S.map((s,i)=>`<div class="st" style="--i:${i}" data-i="${i}" tabindex="0"><div class="art" style="background:repeating-linear-gradient(45deg,${s.c[0]} 0 12px,${s.c[1]} 12px 24px)"></div><span class="num">STAGE ${i+1}</span><span class="n">${s.n}</span></div>`).join('');
function show(i){sel=i;[...g.children].forEach((c,j)=>c.classList.toggle('sel',j===i));const s=S[i];
  info.innerHTML=`<h2>${s.n}</h2><div class="role">${s.r}</div><p>${s.d}</p>${["IMPACTO","DESAFIO","DIVERSÃO"].map((l,k)=>`<div class="stat"><span>${l}</span><div class="b"><i style="width:0" data-w="${s.s[k]}"></i></div></div>`).join('')}<div class="tech">${s.t.map(t=>`<span>${t}</span>`).join('')}</div><div class="press">PRESS ENTER</div>`;
  requestAnimationFrame(()=>info.querySelectorAll('.b i').forEach(b=>b.style.width=b.dataset.w+'%'));
  if(!seen.has(i)){seen.add(i);score+=1000;}document.getElementById('score').textContent=String(score).padStart(6,'0')}
function play(){const r=document.getElementById('ready');r.innerHTML=`<div><h3>STAGE ${sel+1}<br><br>${S[sel].n}</h3><p>READY? · (AQUI ABRIRIA O CASE COMPLETO)<br><br>ESC PARA VOLTAR</p></div>`;r.hidden=false}
g.addEventListener('mouseover',e=>{const t=e.target.closest('.st');if(t&&+t.dataset.i!==sel)show(+t.dataset.i)});
g.addEventListener('click',e=>{const t=e.target.closest('.st');if(t){show(+t.dataset.i);play()}});
document.getElementById('ready').addEventListener('click',()=>document.getElementById('ready').hidden=true);
const coin=document.getElementById('coin');function go(){if(started)return;started=true;document.getElementById('cr').textContent=1;coin.remove()}
coin.addEventListener('click',go);
addEventListener('keydown',e=>{if(!started){go();return}const r=document.getElementById('ready');
  if(e.key==='Escape'){r.hidden=true;return}if(!r.hidden)return;
  const m={ArrowRight:1,ArrowLeft:-1,ArrowDown:3,ArrowUp:-3}[e.key];if(m){e.preventDefault();show((sel+m+S.length)%S.length)}
  if(e.key==='Enter')play()});
show(0);
</script>
</body>
</html>
